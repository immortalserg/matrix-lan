name: Bridge storage tests
on:
  push:
    branches: [feature/postgresql-consolidation, main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  storage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bridge_test
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: bridge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bridge_test -d bridge_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_POSTGRES_DSN: postgresql://bridge_test:ci_only_password@127.0.0.1:5432/bridge_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install psycopg2-binary==2.9.10
      - run: python -m compileall -q install.py bridge_layout.py services
      - run: python -m unittest discover -s tests -p 'test_bridge*storage.py' -v
      - run: python -m unittest discover -s tests -p 'test_bridge_postgres_integration.py' -v

      - run: python -m unittest discover -s tests -p 'test_bridge_message_store_integration.py' -v
